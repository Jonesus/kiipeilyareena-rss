name: Generate RSS Feed

on:
  schedule:
    - cron: '0 * * * *'  # Run hourly
  workflow_dispatch:  # Allow manual trigger

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  generate-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Generate RSS feed
        run: uv run python scraper.py

      - name: Create index.html for GitHub Pages
        run: |
          echo '<!DOCTYPE html>' > index.html
          echo '<html lang="fi">' >> index.html
          echo '<head>' >> index.html
          echo '  <meta charset="UTF-8">' >> index.html
          echo '  <meta name="viewport" content="width=device-width, initial-scale=1.0">' >> index.html
          echo '  <title>Kiipeilyareena - Ajankohtaista RSS</title>' >> index.html
          echo '</head>' >> index.html
          echo '<body>' >> index.html
          echo '  <h1>Kiipeilyareena - Ajankohtaista</h1>' >> index.html
          echo '  <p>RSS feed: <a href="feed.xml">feed.xml</a></p>' >> index.html
          echo '</body>' >> index.html
          echo '</html>' >> index.html

      - name: Clean up
        run: rm -rf .venv __pycache__

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
