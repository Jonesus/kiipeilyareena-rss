name: Generate RSS Feed

on:
  schedule:
    - cron: '0 * * * *'  # Run hourly
  workflow_dispatch:  # Allow manual trigger

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  generate-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Generate RSS feed
        run: uv run python scraper.py

      - name: Create index.html for GitHub Pages
        run: |
          cat > index.html << 'EOF'
          <!DOCTYPE html>
          <html lang="fi">
          <head>
              <meta charset="UTF-8">
              <meta name="viewport" content="width=device-width, initial-scale=1.0">
              <title>Kiipeilyareena - Ajankohtaista RSS</title>
              <style>
                  body { font-family: system-ui, sans-serif; max-width: 600px; margin: 40px auto; padding: 0 20px; text-align: center; }
                  a { color: #0066cc; }
              </style>
          </head>
          <body>
              <h1>Kiipeilyareena - Ajankohtaista</h1>
              <p>RSS feed: <a href="feed.xml">feed.xml</a></p>
          </body>
          </html>
          EOF

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
